<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="GeoVision: end-to-end deep learning for satellite land-use classification">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1220"/>
      <stop offset="1" stop-color="#12284A"/>
    </linearGradient>
    <radialGradient id="globe" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#1D4E6B"/>
      <stop offset="1" stop-color="#0C1A2C"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3DDBC4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3DDBC4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1A2B45" stroke-width="1"/>
    </pattern>
    <clipPath id="reveal">
      <rect x="70" y="160" width="0" height="40">
        <animate attributeName="width" from="0" to="500" dur="2.4s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
    <path id="orbit" d="M 1090 170 m -190 0 a 190 62 0 1 0 380 0 a 190 62 0 1 0 -380 0"/>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#grid)" opacity="0.6"/>

  <!-- title block -->
  <text x="70" y="78" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="4" fill="#3DDBC4">DEEP LEARNING · MAJOR PROJECT</text>
  <text x="66" y="148" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#EEF2F6" letter-spacing="-2">GeoVision</text>
  <g clip-path="url(#reveal)">
    <text x="70" y="190" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#A9B8CC">End-to-end satellite land-use classification</text>
  </g>
  <rect x="70" y="166" width="3" height="30" fill="#3DDBC4">
    <animate attributeName="x" from="70" to="572" dur="2.4s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- stat pills -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.6s" fill="freeze"/>
      <rect x="70" y="232" width="190" height="40" rx="20" fill="#3DDBC4"/>
      <text x="165" y="258" text-anchor="middle" fill="#0A1220">94.5% test accuracy</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.6s" fill="freeze"/>
      <rect x="272" y="232" width="160" height="40" rx="20" fill="none" stroke="#3B5273"/>
      <text x="352" y="258" text-anchor="middle" fill="#EEF2F6">EfficientNet-B0</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.6s" fill="freeze"/>
      <rect x="444" y="232" width="120" height="40" rx="20" fill="none" stroke="#3B5273"/>
      <text x="504" y="258" text-anchor="middle" fill="#EEF2F6">Grad-CAM</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.6s" fill="freeze"/>
      <rect x="576" y="232" width="170" height="40" rx="20" fill="none" stroke="#3B5273"/>
      <text x="661" y="258" text-anchor="middle" fill="#EEF2F6">Drift monitoring</text>
    </g>
  </g>

  <!-- globe -->
  <circle cx="1090" cy="170" r="150" fill="url(#glow)"/>
  <circle cx="1090" cy="170" r="110" fill="url(#globe)" stroke="#3DDBC4" stroke-width="1.5"/>
  <g fill="none" stroke="#3DDBC4" stroke-opacity="0.35" stroke-width="1.2">
    <ellipse cx="1090" cy="170" rx="110" ry="38"/>
    <ellipse cx="1090" cy="170" rx="110" ry="76"/>
    <line x1="980" y1="170" x2="1200" y2="170"/>
    <ellipse cx="1090" cy="170" rx="40" ry="110">
      <animate attributeName="rx" values="40;110;40" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1090" cy="170" rx="80" ry="110">
      <animate attributeName="rx" values="80;10;80" dur="8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- tiles being classified -->
  <g stroke="#0A1220" stroke-width="2">
    <rect x="1066" y="130" width="22" height="22" fill="#2E7D4F"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" begin="0s" repeatCount="indefinite"/></rect>
    <rect x="1090" y="130" width="22" height="22" fill="#3DDBC4"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="1066" y="154" width="22" height="22" fill="#C9A26B"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="1090" y="154" width="22" height="22" fill="#8A93A6"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="1114" y="154" width="22" height="22" fill="#2B5D8A"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" begin="1.6s" repeatCount="indefinite"/></rect>
    <rect x="1090" y="178" width="22" height="22" fill="#6E9E3A"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" begin="2s" repeatCount="indefinite"/></rect>
  </g>

  <!-- orbit + satellite -->
  <use href="#orbit" fill="none" stroke="#FFB547" stroke-width="2" stroke-dasharray="6 7" stroke-opacity="0.7" transform="rotate(-18 1090 170)"/>
  <g transform="rotate(-18 1090 170)">
    <g>
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit"/></animateMotion>
      <rect x="-28" y="-6" width="18" height="12" fill="#FFB547" opacity="0.8"/>
      <rect x="10" y="-6" width="18" height="12" fill="#FFB547" opacity="0.8"/>
      <rect x="-8" y="-8" width="16" height="16" rx="2" fill="#FFB547"/>
    </g>
  </g>
</svg>
