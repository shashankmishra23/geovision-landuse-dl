<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Pipeline: raw data, preprocess, train, evaluate, deploy, monitor, with a retraining loop from monitor back to train">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A1220"/>
      <stop offset="1" stop-color="#101E35"/>
    </linearGradient>
    <path id="flow" d="M 190 92 H 1010"/>
    <path id="loop" d="M 1085 140 V 215 H 503 V 142"/>
  </defs>
  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>

  <!-- main flow line with moving dashes -->
  <use href="#flow" stroke="#22344F" stroke-width="4"/>
  <use href="#flow" stroke="#3DDBC4" stroke-width="4" stroke-dasharray="10 22" stroke-opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="64" to="0" dur="1.2s" repeatCount="indefinite"/>
  </use>
  <!-- retraining loop -->
  <use href="#loop" fill="none" stroke="#FFB547" stroke-width="3" stroke-dasharray="8 10" stroke-opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="36" to="0" dur="1.4s" repeatCount="indefinite"/>
  </use>
  <polygon points="495,148 503,136 511,148" fill="#FFB547"/>
  <text x="794" y="238" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#FFB547">drift alert → label recent data → retrain</text>

  <!-- travelling data packet -->
  <circle r="7" fill="#EEF2F6">
    <animateMotion dur="4.8s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="4.8s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- six stages, each glows in turn -->
    <g>
      <rect x="40" y="48" width="150" height="88" rx="14" fill="#111D30" stroke="#22344F" stroke-width="2"/>
      <rect x="40" y="48" width="150" height="88" rx="14" fill="none" stroke="#3DDBC4" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.08;0.2;1" dur="4.8s" begin="0s" repeatCount="indefinite"/></rect>
      <text x="115" y="86" font-size="18" font-weight="700" fill="#EEF2F6">Raw data</text>
      <text x="115" y="110" font-size="13" fill="#A9B8CC">27,000 Sentinel-2</text>
    </g>
    <g>
      <rect x="234" y="48" width="150" height="88" rx="14" fill="#111D30" stroke="#22344F" stroke-width="2"/>
      <rect x="234" y="48" width="150" height="88" rx="14" fill="none" stroke="#3DDBC4" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.08;0.2;1" dur="4.8s" begin="0.8s" repeatCount="indefinite"/></rect>
      <text x="309" y="86" font-size="18" font-weight="700" fill="#EEF2F6">Preprocess</text>
      <text x="309" y="110" font-size="13" fill="#A9B8CC">validate · split</text>
    </g>
    <g>
      <rect x="428" y="48" width="150" height="88" rx="14" fill="#111D30" stroke="#3DDBC4" stroke-width="2"/>
      <rect x="428" y="48" width="150" height="88" rx="14" fill="#3DDBC4" opacity="0"><animate attributeName="opacity" values="0;0.18;0;0" keyTimes="0;0.08;0.2;1" dur="4.8s" begin="1.6s" repeatCount="indefinite"/></rect>
      <text x="503" y="86" font-size="18" font-weight="700" fill="#EEF2F6">Train</text>
      <text x="503" y="110" font-size="13" fill="#A9B8CC">EfficientNet-B0</text>
    </g>
    <g>
      <rect x="622" y="48" width="150" height="88" rx="14" fill="#111D30" stroke="#22344F" stroke-width="2"/>
      <rect x="622" y="48" width="150" height="88" rx="14" fill="none" stroke="#3DDBC4" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.08;0.2;1" dur="4.8s" begin="2.4s" repeatCount="indefinite"/></rect>
      <text x="697" y="86" font-size="18" font-weight="700" fill="#EEF2F6">Evaluate</text>
      <text x="697" y="110" font-size="13" fill="#A9B8CC">F1 · ECE · Grad-CAM</text>
    </g>
    <g>
      <rect x="816" y="48" width="150" height="88" rx="14" fill="#111D30" stroke="#22344F" stroke-width="2"/>
      <rect x="816" y="48" width="150" height="88" rx="14" fill="none" stroke="#FFB547" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.08;0.2;1" dur="4.8s" begin="3.2s" repeatCount="indefinite"/></rect>
      <text x="891" y="86" font-size="18" font-weight="700" fill="#EEF2F6">Deploy</text>
      <text x="891" y="110" font-size="13" fill="#A9B8CC">FastAPI · web app</text>
    </g>
    <g>
      <rect x="1010" y="48" width="150" height="88" rx="14" fill="#111D30" stroke="#FFB547" stroke-width="2"/>
      <rect x="1010" y="48" width="150" height="88" rx="14" fill="#FFB547" opacity="0"><animate attributeName="opacity" values="0;0.18;0;0" keyTimes="0;0.08;0.2;1" dur="4.8s" begin="4s" repeatCount="indefinite"/></rect>
      <text x="1085" y="86" font-size="18" font-weight="700" fill="#EEF2F6">Monitor</text>
      <text x="1085" y="110" font-size="13" fill="#A9B8CC">PSI drift · feedback</text>
    </g>
  </g>
</svg>
