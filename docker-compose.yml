services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes:
      - ./monitoring:/app/monitoring   # prediction log survives container restarts

  dashboard:
    build: .
    command: ["streamlit", "run", "app/dashboard.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      GEOVISION_API: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
